<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#06070A">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='17' rx='12' ry='11' fill='%23F4A58A'/%3E%3Cellipse cx='13' cy='13' rx='5' ry='3.5' fill='%23fff' opacity='.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Myeongjo:wght@800&family=IBM+Plex+Sans+KR:wght@600&display=swap">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="page bd-page">
  <header class="doc-head">
    <p class="wordmark">몽돌</p>
    <h1 class="doc-title">내 생일의 우리말</h1>
  </header>

  <form class="bd-form" id="form">
    <p class="lede">생일을 고르면, 그날에 어울리는 우리말 하나를 알려 줘요.</p>
    <div class="bd-pick">
      <label class="bd-select"><span class="label">월</span><select class="box" id="month" aria-label="태어난 달"></select></label>
      <label class="bd-select"><span class="label">일</span><select class="box" id="day" aria-label="태어난 날"></select></label>
    </div>
    <button class="primary-btn" type="submit">알아보기</button>
  </form>

  <section class="bd-result" id="result" hidden aria-live="polite">
    <div class="bd-card" id="card">
      <p class="bd-date" id="date"></p>
      <p class="bd-word" id="word"></p>
      <p class="bd-meaning" id="meaning"></p>
    </div>
    <div class="bd-more">
      <p class="bd-more-title">이날의 다른 말</p>
      <ul class="bd-more-list" id="more"></ul>
    </div>
    <div class="bd-actions">
      <button class="ghost-btn" type="button" id="again">다른 날도 보기</button>
      <button class="ghost-btn" type="button" id="share">친구에게도 알려 주기</button>
    </div>
    <p class="bd-copied" id="copied" hidden>주소를 복사했어요</p>

    <div class="bd-app">
      <div class="bd-app-row">
        <img class="bd-app-shot" src="./img/get-phone.jpg" alt="몽돌 화면 — 바다 사진에 「윤슬」 한 단어가 붙은 모습" width="428" height="880">
        <div class="bd-app-text">
          <p class="bd-app-bridge" id="bridge"></p>
          <p class="bd-app-lede">오늘 찍은 사진엔 어떤 말이 붙을까요? 몽돌은 사진을 담으면 그 순간에 맞는 우리말 하나를 붙여 줘요.</p>
        </div>
      </div>
      <a class="primary-btn" id="app" href="/get?utm_source=birthday&amp;utm_medium=web">몽돌 받으러 가기</a>
      <p class="bd-ios-note" id="iosNote" hidden>몽돌은 지금 iPhone 앱만 있어요.</p>
      <a class="ghost-btn bd-insta" id="insta" hidden>인스타에서 매일 한 단어씩 보기</a>
    </div>
  </section>

  <p class="privacy">고른 생일은 이 화면에서만 쓰고 어디에도 보내지 않아요.<br>뜻풀이 · 국립국어원 표준국어대사전(일부는 쉽게 풀어 씀)</p>
</main>
<script src="./js/birthday.js"></script>
</body>
</html>
