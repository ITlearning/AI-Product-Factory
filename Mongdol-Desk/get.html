<head>
<meta charset="utf-8">

<meta name="format-detection" content="telephone=no">
<title>몽돌 · 사진에 우리말 한 단어</title>
<meta name="description" content="찍기만 하면 그 순간에 맞는 우리말이 하나 붙는 iPhone 앱, 몽돌.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='17' rx='12' ry='11' fill='%23F4A58A'/%3E%3Cellipse cx='13' cy='13' rx='5' ry='3.5' fill='%23fff' opacity='.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Myeongjo:wght@800&family=IBM+Plex+Sans+KR:wght@600&display=swap">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="page">
  <header class="doc-head">
    <p class="wordmark">몽돌</p>
    <h1 class="doc-title">찍기만 하면, 그 순간에 맞는 말이 하나 붙어요</h1>
  </header>
  <article class="doc">
    <a class="primary-btn get-appstore get-appstore-top" data-place="top" href="https://apps.apple.com/kr/app/id6817888379">App Store에서 받기</a>
    <img class="get-shot" src="/img/get-phone.jpg" alt="몽돌 화면 — 윤슬 사진에 「윤슬」 한 단어가 붙은 모습" width="428" height="880">
    <p class="doc-lede">표준국어대사전의 우리말 1,600여 개 가운데 그날의 빛과 날씨, 사진 속 주인공을 보고 골라요. 하루가 닫히면 그날 사진의 색으로 빚은 조약돌이 도착해요.</p>
    <a class="primary-btn get-appstore" data-place="bottom" href="https://apps.apple.com/kr/app/id6817888379">App Store에서 받기</a>
    <p class="support-note">iPhone 앱이에요. 사진은 기기 밖으로 나가지 않아요.<br>뜻풀이 · 국립국어원 표준국어대사전</p>
  </article>
  <footer class="doc-foot"><a href="/privacy">개인정보 처리방침</a></footer>
</main>
<!-- 광고로 들어온 조회·App Store 버튼 누름만 센다. 앱과 같은 PostHog 프로젝트(EU). 쿠키·저장소 없이, 녹화 없이, 사람 프로필 없이, 앱처럼 GeoIP 끔.
     posthog-js 를 받아 켜기 전에 닫거나 넘어가면 안 세져서(Meta 랜딩 조회 112 중 약 50만 잡힘) 열리는 즉시 sendBeacon 으로 직접 보낸다. -->
<script>
(function () {
  var KEY = 'phc_nQAKwQjfrQnNCXC4FomYsLBH79wA4jVnokYKw7uMLicK';
  var URL_ = 'https://eu.i.posthog.com/i/v0/e/';
  var id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
  var q = new URLSearchParams(location.search);
  var ua = navigator.userAgent;
  var base = {
    $lib: 'web',
    $current_url: location.href,
    $host: location.host,
    $pathname: location.pathname,
    $referrer: document.referrer || '$direct',
    $screen_width: screen.width,
    $screen_height: screen.height,
    $browser_language: navigator.language,
    $os: /iPhone|iPad|iPod/.test(ua) ? 'iOS' : /Android/.test(ua) ? 'Android' : /Mac OS X/.test(ua) ? 'Mac OS X' : /Windows/.test(ua) ? 'Windows' : 'Other',
    $device_type: /iPad|Tablet/.test(ua) ? 'Tablet' : /Mobi|iPhone|Android/.test(ua) ? 'Mobile' : 'Desktop',
    $process_person_profile: false,
    $geoip_disable: true,
  };
  ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'utm_id'].forEach(function (k) { if (q.get(k)) base[k] = q.get(k); });
  function send(event, extra) {
    var props = Object.assign({}, base, extra || {});
    var body = JSON.stringify({ api_key: KEY, event: event, distinct_id: id, timestamp: new Date().toISOString(), properties: props });
    var blob = new Blob([body], { type: 'text/plain' });
    if (!(navigator.sendBeacon && navigator.sendBeacon(URL_, blob))) {
      fetch(URL_, { method: 'POST', body: body, keepalive: true, headers: { 'Content-Type': 'text/plain' } }).catch(function () {});
    }
  }
  send('$pageview');
  document.querySelectorAll('.get-appstore').forEach(function (a) {
    a.addEventListener('click', function () { send('get_appstore_click', { place: a.dataset.place }); });
  });
})();
</script>
</body>
</html>
