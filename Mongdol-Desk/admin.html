<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#06070A">
<meta name="color-scheme" content="dark">
<title>몽돌 데스크</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='17' rx='12' ry='11' fill='%23F4A58A'/%3E%3Cellipse cx='13' cy='13' rx='5' ry='3.5' fill='%23fff' opacity='.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Myeongjo:wght@800&family=IBM+Plex+Sans+KR:wght@600&display=swap">
<link rel="stylesheet" href="./styles.css">
</head>
<body class="admin">
<main class="page">
  <form class="login" id="ad-login" hidden>
    <h1 class="wordmark">몽돌 데스크</h1>
    <p class="lede">Vercel 에 넣어 둔 ADMIN_TOKEN 을 적어 주세요. 이 브라우저에만 기억해요.</p>
    <div class="field">
      <label class="label" for="ad-token">토큰</label>
      <input id="ad-token" class="box" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <button class="primary-btn" type="submit">열기</button>
    <p class="error" id="ad-login-error" role="alert" hidden></p>
  </form>

  <div id="ad-main" hidden>
    <div class="admin-head">
      <h1 class="wordmark">몽돌 데스크</h1>
      <button class="ghost-btn" id="ad-lock" type="button">잠그기</button>
    </div>
    <!-- 관리 기능이 늘면 여기에 칸을 더하고 <section data-section> 을 하나씩 붙인다. -->
    <nav class="sections" aria-label="관리 메뉴">
      <a href="#feedback" aria-current="page">건의함</a>
    </nav>

    <section id="feedback" data-section="feedback">
      <div class="section-head">
        <p class="summary num" id="ad-summary"></p>
        <button class="ghost-btn" id="ad-reload" type="button">새로 고침</button>
      </div>
      <div class="chips filters" role="radiogroup" aria-label="종류">
        <label class="chip"><input type="radio" name="filter" value="all" checked><span>전체</span></label>
        <label class="chip"><input type="radio" name="filter" value="unread"><span>안 읽은 것</span></label>
        <label class="chip"><input type="radio" name="filter" value="bug"><span>불편한 점</span></label>
        <label class="chip"><input type="radio" name="filter" value="wish"><span>바라는 기능</span></label>
        <label class="chip"><input type="radio" name="filter" value="etc"><span>그 밖에</span></label>
      </div>
      <p class="error" id="ad-error" role="alert" hidden></p>
      <ul class="list" id="ad-list"></ul>
      <p class="empty" id="ad-empty" hidden>아직 받은 건의가 없어요.</p>
      <button class="ghost-btn more" id="ad-more" type="button" hidden>더 불러오기</button>
    </section>
  </div>
</main>
<script src="./js/admin.js"></script>
</body>
</html>
