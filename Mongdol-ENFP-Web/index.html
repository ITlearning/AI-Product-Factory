<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF4EC">
<meta name="description" content="찍을 땐 색을 숨겨 뒀다가, 하루가 닫히면 그날 색으로 빚은 조약돌이 도착해요. 몽돌 ENFP 웹판.">
<title>몽돌</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='17' rx='12' ry='11' fill='%23F4A58A'/%3E%3Cellipse cx='13' cy='13' rx='5' ry='3.5' fill='%23fff' opacity='.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Myeongjo:wght@700;800&family=Nanum+Pen+Script&family=IBM+Plex+Sans+KR:wght@600&display=swap">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="stage">
  <div id="bg" aria-hidden="true"><div id="bg-flowers"></div></div>

  <div id="home-wrap">
    <div id="backdrop" aria-hidden="true"><div id="bd-a" class="bd"></div><div id="bd-b" class="bd"></div></div>
    <main id="home" aria-label="몽돌 홈"></main>
    <div class="bottom-fade" aria-hidden="true"></div>
    <div id="month-pill" class="num" aria-hidden="true"></div>
    <button id="swipe-hint" hidden aria-label="카메라 열기 — 왼쪽 가장자리를 오른쪽으로 쓸어도 돼요">
      <span class="hint-bar"></span><span class="hint-flower"></span><span class="hint-text">쓱 밀면 찰칵</span>
    </button>
    <button id="settings-btn" aria-label="설정">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><g fill="currentColor"><circle cx="11" cy="4.6" r="3"/><circle cx="17.1" cy="9" r="3"/><circle cx="14.8" cy="16.2" r="3"/><circle cx="7.2" cy="16.2" r="3"/><circle cx="4.9" cy="9" r="3"/></g><circle cx="11" cy="11" r="3.2" fill="#FFD84D"/></svg>
    </button>
  </div>

  <section id="camera" aria-label="담기"></section>
  <div id="layers"></div>

  <div id="boot-fail" hidden>
    <p class="boot-title">앗, 몽돌이 아직 못 일어났어요</p>
    <p>ES 모듈이라 파일을 바로 열면(file://) 막히는 브라우저가 있어요. 폴더에서 <code>python3 -m http.server</code> 로 띄워서 열어 주세요.</p>
    <p class="boot-err"><code></code></p>
  </div>
</div>
<script type="module" src="./js/main.js"></script>
<script>
  // 모듈이 아예 못 뜨는 환경(file:// 등) 안내 — 3초 안에 부팅 표시가 없으면 보여 준다.
  setTimeout(function () {
    if (!document.documentElement.classList.contains('booted')) {
      var f = document.getElementById('boot-fail');
      if (f) f.hidden = false;
    }
  }, 3000);
</script>
</body>
</html>
