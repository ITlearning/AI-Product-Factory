<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>몽돌 오늘의 단어</title>
<style>
@font-face { font-family: 'MongdolSerif'; src: url('../app-store/fonts/NanumMyeongjo-Bold.ttf'); font-weight: 700; }
@font-face { font-family: 'MongdolSans'; src: url('../../Shared/Design/Fonts/GowunDodum-Hangul.ttf'); }

html, body { margin: 0; }
body { width: 1080px; height: 1350px; overflow: hidden; background: #0B0C10; }
#card { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #0B0C10; }
.tint { position: absolute; inset: 0; background:
  radial-gradient(900px 760px at 50% 30%, var(--c-glow) 0%, transparent 72%),
  linear-gradient(180deg, var(--c-top) 0%, #0B0C10 100%); }
.grain { position: absolute; inset: 0; opacity: .08; mix-blend-mode: overlay; z-index: 9;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

.head { position: absolute; top: 64px; left: 0; right: 0; text-align: center; z-index: 5;
  font-family: 'MongdolSans'; font-size: 30px; letter-spacing: .08em; color: rgba(255,255,255,.62); }
.photo { position: absolute; left: 120px; top: 136px; width: 840px; height: 760px; border-radius: 36px; overflow: hidden; z-index: 5;
  box-shadow: 0 40px 90px rgba(0,0,0,.55); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

.word { position: absolute; left: 80px; right: 80px; top: 950px; text-align: center; z-index: 5; }
.word h1 { margin: 0; font-family: 'MongdolSerif'; font-weight: 700; font-size: 112px; line-height: 1.15; letter-spacing: .04em;
  color: rgba(255,255,255,.95); }
.word p { margin: 28px auto 0; max-width: 820px; font-family: 'MongdolSans'; font-size: 36px; line-height: 1.5;
  color: rgba(255,255,255,.72); word-break: keep-all; }
.dot { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: var(--c-dot); vertical-align: 2px; margin-right: 14px;
  box-shadow: 0 0 18px var(--c-dot); }

.mark { position: absolute; bottom: 52px; left: 0; right: 0; text-align: center; z-index: 5;
  font-family: 'MongdolSerif'; font-size: 30px; color: rgba(255,255,255,.45); letter-spacing: .1em; }
</style>
</head>
<body>
<div id="card">
  <div class="tint"></div>
  <div class="head" id="head"></div>
  <div class="photo"><img id="photo" alt=""></div>
  <div class="word">
    <h1 id="word"></h1>
    <p id="meaning"></p>
  </div>
  <div class="mark">몽돌</div>
  <div class="grain"></div>
</div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById('word').textContent = q.get('word') || '윤슬';
document.getElementById('meaning').textContent = q.get('meaning') || '햇빛이나 달빛에 비쳐 반짝이는 잔물결';
const head = document.getElementById('head');
head.innerHTML = '<span class="dot"></span>';
head.append('오늘의 단어' + (q.get('date') ? ' · ' + q.get('date') : ''));

const root = document.documentElement.style;
function paint(r, g, b) {
  root.setProperty('--c-dot', `rgb(${r},${g},${b})`);
  root.setProperty('--c-glow', `rgba(${r},${g},${b},.42)`);
  root.setProperty('--c-top', `rgb(${Math.round(r * .32 + 11 * .68)},${Math.round(g * .32 + 12 * .68)},${Math.round(b * .32 + 16 * .68)})`);
}
function hex(h) { const n = parseInt(h.replace('#', ''), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

const img = document.getElementById('photo');
img.onload = () => {
  if (q.get('color')) return paint(...hex(q.get('color')));
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, 32, 32);
  let d; try { d = x.getImageData(0, 0, 32, 32).data; } catch { return paint(120, 130, 150); }
  // 가장 흔한 색 한 점 — 평균은 회색으로 뭉개진다. 너무 어둡거나 하얀 칸은 뺀다.
  const bins = new Map();
  for (let i = 0; i < d.length; i += 4) {
    const [r, g, b] = [d[i], d[i + 1], d[i + 2]], mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    if (mx < 40 || mn > 230) continue;
    const k = (r >> 5) << 6 | (g >> 5) << 3 | (b >> 5), sat = mx ? (mx - mn) / mx : 0;
    const e = bins.get(k) || { w: 0, n: 0, r: 0, g: 0, b: 0 };
    e.w += 1 + sat * 2; e.n++; e.r += r; e.g += g; e.b += b; bins.set(k, e);
  }
  let best = null; for (const e of bins.values()) if (!best || e.w > best.w) best = e;
  if (!best) return paint(120, 130, 150);
  paint(Math.round(best.r / best.n), Math.round(best.g / best.n), Math.round(best.b / best.n));
};
img.src = q.get('photo') || '';
</script>
</body>
</html>
