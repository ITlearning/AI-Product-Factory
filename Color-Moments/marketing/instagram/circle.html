<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>몽돌 원</title>
<style>
@font-face { font-family: 'MongdolSerif'; src: url('../app-store/fonts/NanumMyeongjo-Bold.ttf'); font-weight: 700; }
@font-face { font-family: 'MongdolSans'; src: url('../../Shared/Design/Fonts/GowunDodum-Hangul.ttf'); }

html, body { margin: 0; }
body { width: 1080px; height: 1350px; overflow: hidden; background: var(--bg, #1d3f8f); color: #fff; }
body.reel { height: 1920px; }
/* 사진은 늘 화면 전체에 깔고 둥근 마스크만 키운다 — 원 안 구도가 마지막 전면 사진과 이어진다. */
.photo { position: absolute; inset: 0; background-size: cover; background-position: center; }
.shade { position: absolute; inset: 0; opacity: 0; background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,.55) 78%, rgba(0,0,0,.65) 100%); }
.ask { position: absolute; left: 80px; right: 80px; bottom: 210px; text-align: center; font-family: 'MongdolSerif'; font-weight: 700; font-size: 60px; }
.hint { position: absolute; left: 0; right: 0; bottom: 120px; text-align: center; font-family: 'MongdolSans'; font-size: 28px; color: rgba(255,255,255,.7); }
body.reel .ask { bottom: 640px; } body.reel .hint { display: none; }
.text { position: absolute; left: 80px; right: 80px; bottom: 150px; text-align: center; opacity: 0; }
body.reel .text { bottom: 560px; }
.text h1 { margin: 0; font-family: 'MongdolSerif'; font-weight: 700; font-size: 120px; line-height: 1.15; letter-spacing: .04em; text-shadow: 0 4px 30px rgba(0,0,0,.35); }
.text p { margin: 24px auto 0; max-width: 820px; font-family: 'MongdolSans'; font-size: 36px; line-height: 1.5; color: rgba(255,255,255,.88); word-break: keep-all; }
.text b { display: block; margin-top: 40px; font-family: 'MongdolSerif'; font-size: 30px; letter-spacing: .1em; color: rgba(255,255,255,.7); }
.grain { position: absolute; inset: 0; opacity: .07; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
</style>
</head>
<body>
<div class="photo" id="photo"></div>
<div class="shade" id="shade"></div>
<div class="ask" id="ask">이 사진에 붙은 단어는?</div>
<div class="hint" id="hint">아래 점을 꾹 누른 채 밀어 보세요</div>
<div class="text" id="text"><h1 id="word"></h1><p id="meaning"></p><b>몽돌</b></div>
<div class="grain"></div>
<script>
// 캐러셀: ?slide=k&slides=N 로 k 번째 장(1부터). 릴스: ?reel=1 이면 reel.mjs 가 frame(t) 를 넘기며 찍는다.
const q = new URLSearchParams(location.search), reel = !!q.get('reel');
if (reel) document.body.classList.add('reel');
document.getElementById('word').textContent = q.get('word');
document.getElementById('meaning').textContent = q.get('meaning');
const photo = document.getElementById('photo'), W = 1080, H = reel ? 1920 : 1350;
photo.style.backgroundImage = `url("${q.get('photo')}")`;

const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
const mix = (a, b, p) => a + (b - a) * p;
// p: 0 이면 왼쪽 위 작은 원, 1 이면 화면을 다 덮는 원(가장자리 흐림도 화면 밖으로).
function circle(p) {
  const r = mix(150, Math.hypot(W, H) * .62, p), x = mix(W * .3, W * .5, p), y = mix(H * .3, H * .45, p);
  const m = `radial-gradient(circle ${r}px at ${x}px ${y}px, #000 ${r - 60}px, transparent ${r}px)`;
  photo.style.webkitMaskImage = photo.style.maskImage = m;
}
function words(p, askOn) {
  document.getElementById('ask').style.opacity = askOn;
  document.getElementById('hint').style.opacity = askOn;
  document.getElementById('shade').style.opacity = p;
  document.getElementById('text').style.opacity = p;
}

// 대표 색 — 가장 흔한 색 칸을 반쯤 어둡게 해서 바탕에 깐다(참고 릴스의 파란 바탕 자리).
const img = new Image();
window.ready = Promise.all([new Promise(done => { img.onload = () => {
  const c = document.createElement('canvas'); c.width = c.height = 32; const x = c.getContext('2d');
  x.drawImage(img, 0, 0, 32, 32); const d = x.getImageData(0, 0, 32, 32).data, bins = new Map();
  for (let i = 0; i < d.length; i += 4) { const [r, g, b] = [d[i], d[i + 1], d[i + 2]], mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    if (mx < 40 || mn > 230) continue; const k = (r >> 5) << 6 | (g >> 5) << 3 | (b >> 5), e = bins.get(k) || { w: 0, n: 0, r: 0, g: 0, b: 0 };
    e.w += 1 + (mx - mn) / mx * 2; e.n++; e.r += r; e.g += g; e.b += b; bins.set(k, e); }
  let best = null; for (const e of bins.values()) if (!best || e.w > best.w) best = e;
  if (q.get('color')) document.body.style.setProperty('--bg', q.get('color'));
  else if (best) document.body.style.setProperty('--bg', `rgb(${best.r / best.n * .55 | 0},${best.g / best.n * .55 | 0},${best.b / best.n * .55 | 0})`);
  done(); }; img.onerror = done; img.src = q.get('photo'); }), document.fonts.ready]);

const steps = [0, .16, .38, .66, 1];
if (reel) {
  window.reelLength = 8;
  const inOut = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; // 처음엔 천천히 — 원이 커지는 걸 봐야 한다
  window.frame = t => { circle(inOut((t - .5) / 4.4)); words(ease((t - 4.3) / .8), 1 - ease((t - 3.6) / .5)); };
} else {
  const k = Number(q.get('slide') || 1) - 1, n = Number(q.get('slides') || steps.length);
  const p = steps[Math.round(k * (steps.length - 1) / Math.max(1, n - 1))];
  circle(p); words(p === 1 ? 1 : 0, k === 0 ? 1 : 0);
}
</script>
</body>
</html>
