<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>몽돌 화면 릴스</title>
<!-- 화면 녹화 릴스의 바탕(?part=bg)과 끝 장면(?part=end). 녹화 화면은 screenreel.swift 가 바탕 위 가운데에 얹는다. -->
<style>
@font-face { font-family: 'MongdolSerif'; src: url('../app-store/fonts/NanumMyeongjo-Bold.ttf'); font-weight: 700; }
@font-face { font-family: 'MongdolSans'; src: url('../../Shared/Design/Fonts/GowunDodum-Hangul.ttf'); }
html, body { margin: 0; }
body { width: 1080px; height: 1920px; overflow: hidden; background: #06070A; color: #fff; position: relative; }
body::before { content: ""; position: absolute; inset: 0;
  background: radial-gradient(60% 40% at 50% 46%, rgba(214,196,186,.22), transparent 70%), radial-gradient(50% 30% at 50% 0%, rgba(244,165,190,.18), transparent 70%); }
.hook { position: absolute; top: 150px; left: 60px; right: 60px; text-align: center; }
.hook h1 { margin: 0; font-family: 'MongdolSerif'; font-weight: 700; font-size: 66px; line-height: 1.25; }
.hook p { margin: 16px 0 0; font-family: 'MongdolSans'; font-size: 34px; color: rgba(255,255,255,.72); }
.end { display: none; position: absolute; inset: 0; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 90px 260px; }
body.end-part .hook { display: none; }
body.end-part .end { display: flex; }
.end h1 { margin: 0; font-family: 'MongdolSerif'; font-weight: 700; font-size: 84px; line-height: 1.3; }
.end .cta { margin-top: 70px; display: grid; gap: 26px; }
.end .cta div { padding: 30px 44px; border-radius: 40px; border: 2px solid rgba(255,255,255,.28); background: rgba(255,255,255,.07);
  font-family: 'MongdolSans'; font-size: 40px; line-height: 1.45; }
.end .cta b { font-family: 'MongdolSerif'; font-weight: 700; }
.end .mark { margin-top: 80px; font-family: 'MongdolSerif'; font-size: 40px; color: rgba(255,255,255,.75); letter-spacing: .1em; }
</style>
</head>
<body>
<div class="hook"><h1 id="hook"></h1><p id="sub"></p></div>
<div class="end"><h1 id="endTitle"></h1><div class="cta"><div id="c1"></div><div id="c2"></div></div><div class="mark">몽돌</div></div>
<script>
const q = new URLSearchParams(location.search);
if (q.get('part') === 'end') document.body.classList.add('end-part');
document.getElementById('hook').innerHTML = (q.get('hook') || '').replace(/\n/g, '<br>');
document.getElementById('sub').textContent = q.get('sub') || '';
document.getElementById('endTitle').innerHTML = (q.get('end') || '').replace(/\n/g, '<br>');
document.getElementById('c1').innerHTML = (q.get('c1') || '👥 같이 해 볼 친구를 <b>태그</b>해 주세요').replace(/\n/g, '<br>');
document.getElementById('c2').innerHTML = (q.get('c2') || '🔗 링크는 <b>프로필</b>에 있어요').replace(/\n/g, '<br>');
</script>
</body>
</html>
