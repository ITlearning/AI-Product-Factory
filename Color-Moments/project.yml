name: ColorMoments
options:
  bundleIdPrefix: com.itlearning
  deploymentTarget:
    iOS: "18.0"          # LockedCameraCapture 하한
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ZMXTCSPNUZ
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ColorMoments:
    type: application
    platform: iOS
    sources: [ColorMoments, Shared]
    dependencies:
      - sdk: AVKit.framework
      - target: ColorMomentsCapture
        embed: true
      - target: ColorMomentsControl
        embed: true
    scheme:
      testTargets: [ColorMomentsTests]
      gatherCoverageData: false
    entitlements:
      path: ColorMoments/ColorMoments.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.itlearning.colormoments]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
        com.apple.security.application-groups: [group.com.itlearning.colormoments]
    info:
      path: ColorMoments/Info.plist
      properties:
        UIBackgroundModes: [remote-notification]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itlearning.colormoments
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 몽돌
        INFOPLIST_KEY_NSCameraUsageDescription: 순간의 색을 남기기 위해 카메라를 사용합니다.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 고른 사진을 몽돌에 담고, 찍은 시각과 장소를 하루에 씁니다. 사진은 기기 밖으로 나가지 않습니다.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 촬영한 사진을 사진 앱에도 저장합니다.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"

  ColorMomentsCapture:
    type: extensionkit-extension
    platform: iOS
    sources: [ColorMomentsCapture, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itlearning.colormoments.capture
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: 몽돌
        INFOPLIST_KEY_NSCameraUsageDescription: 순간의 색을 남기기 위해 카메라를 사용합니다.
    info:
      path: ColorMomentsCapture/Info.plist
      properties:
        CFBundleDisplayName: 몽돌
        NSCameraUsageDescription: 순간의 색을 남기기 위해 카메라를 사용합니다.
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.securecapture

  ColorMomentsControl:
    type: app-extension
    platform: iOS
    sources: [ColorMomentsControl, Shared]
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: ColorMomentsControl/ColorMomentsControl.entitlements
      properties:
        com.apple.security.application-groups: [group.com.itlearning.colormoments]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itlearning.colormoments.control
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: 몽돌
    info:
      path: ColorMomentsControl/Info.plist
      properties:
        CFBundleDisplayName: 몽돌
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  ColorMomentsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ColorMomentsTests
        excludes: ["Fixtures"]
      - path: ColorMomentsTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: ColorMoments
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itlearning.colormoments.tests
        GENERATE_INFOPLIST_FILE: true
